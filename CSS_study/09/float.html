<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li{
            float: left;
            width: 100px;
            height: 100px;
            background-color: pink;
        }
        p{
            width: 100%;
            height: 100px;
            background-color: aquamarine;
            margin: 0 ;
        }
        .clear{
            clear: both;
        }
        ul::after{
            content: "";
            display: block;
            clear: both;
        }
    </style>
</head>
<body>
    <ul>
        <li >1</li>
        <li>2</li>
        <li>3</li>
    </ul>
    <!-- <div class="clear"></div> -->
    <p></p>
</body>
</html>
